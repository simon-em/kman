name: deploy-review
repo: dx
branch: main
args:
  ENVIRONMENT:
    default: staging
    description: target environment
  REPO_BRANCH:
    required: true
env:
  CI: "true"
steps:
  - name: run tests
    run: go test ./...
  - name: review
    claude: Review the diff and summarize risk.
    permission_mode: bypassPermissions
    max_turns: 20
